# 지표 파라미터(임계값, 기간 등). 초기값은 지침서(docs/project_spec.md) 1.4~1.5장 및
# 조사 출처(sources.md)의 통상적 언급값을 참고한 "1차 참고값"이며, 6장 백테스트로 반드시
# 재검증 후 확정한다. 확정 전까지 이 파일의 값을 "최종 기준"으로 사용하지 않는다.

volume:
  surge_lookback_days: 20        # 평균 거래량 계산 기간(N일)
  surge_ratio_threshold: 3.0     # 당일 거래량 / N일 평균 (예: 300%)
  low_retest_lookback_days: 60

flow:
  co_netbuy_lookback_days: 20    # 기관+외국인 동반 순매수 연속일수 판단 기간

credit_short:
  credit_ratio_spike_pct: 0.3    # 신용잔고율 급증 판단 기준(상대 증가율, 참고값)
  short_balance_spike_pct: 0.3

orderbook:
  # Phase 2+ (실시간 데이터 필요)
  strength_bullish_threshold: 150   # 체결강도 %, 매수세 우위 유지 기준
  strength_bearish_threshold: 100   # 이 값 하회 시 국면 전환 후보

vi:
  dynamic_kospi200_pct: 3
  dynamic_others_kosdaq_pct: 6
  static_pct: 10
  lookback_months: 3

pattern:
  ma_periods: [5, 20, 60, 120]   # 정배열 판단 이동평균선 기간
  pullback_lookback_days: 60      # 눌림목 패턴 탐색 기간

scoring:
  method: "weighted_sum"          # weighted_sum | rule_based | ml (백테스트 후 결정)
  score_range: [0, 100]
  weights:
    # 초기 균등 가중치(placeholder). 백테스트로 튜닝 전까지 균등값 유지.
    volume: 1.0
    flow: 1.0
    credit_short: 1.0
    orderbook: 1.0
    vi: 1.0
    pattern: 1.0
